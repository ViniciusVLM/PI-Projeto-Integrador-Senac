<aside class="lado-esquerdo-dash">
  <div class="logo">
    <i class="bi bi-shield-check"></i>
    <div>
      <h3>SecureDesk</h3>
      <p>Gestão de chamados de TI</p>
    </div>
  </div>

  <nav class="menuItems">
    <a class="menuItem" routerLink="/dashboard" routerLinkActive="active">
      <i class="bi bi-grid"></i><h4>Dashboard</h4>
    </a>
    <a class="menuItem" routerLink="/chamados" routerLinkActive="active">
      <i class="bi bi-ticket-perforated"></i><h4>Chamados</h4>
    </a>
    <a class="menuItem" routerLink="/usuarios" routerLinkActive="active">
      <i class="bi bi-people"></i><h4>Usuários</h4>
    </a>
    <a class="menuItem" routerLink="/equipamentos" routerLinkActive="active">
      <i class="bi bi-pc-display"></i><h4>Equipamentos</h4>
    </a>
    <a class="menuItem" routerLink="/categorias" routerLinkActive="active">
      <i class="bi bi-tags"></i><h4>Categorias</h4>
    </a>
    <a class="menuItem" routerLink="/relatorios" routerLinkActive="active">
      <i class="bi bi-bar-chart"></i><h4>Relatórios</h4>
    </a>
    <a class="menuItem" routerLink="/configuracoes" routerLinkActive="active">
      <i class="bi bi-gear"></i><h4>Configurações</h4>
    </a>
  </nav>

  <footer>
    <div class="user-info">
      <div class="avatar">{{ iniciais }}</div>
      <div class="user-text">
        <h4>{{ nomeUsuario }}</h4>
        <p>{{ cargoUsuario }}</p>
      </div>
    </div>
  </footer>
</aside>
