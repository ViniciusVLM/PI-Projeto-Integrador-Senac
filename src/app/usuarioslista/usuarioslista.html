<div class="container-dash">
  <app-sidebar />

  <main class="lado-direito-dash">
    <header class="topo">
      <div class="titulo-pagina">
        <h1>Usuários</h1>
        <p>Gerencie os usuários do sistema</p>
      </div>

      <div class="topo-acoes">
        <label class="busca">
          <i class="bi bi-search"></i>
          <input type="text" placeholder="Buscar usuário..." (input)="onBusca($event)" />
        </label>
        <button type="button" class="btn btn-enviar btn-novo">
          <i class="bi bi-plus-lg"></i> Novo usuário
        </button>
      </div>
    </header>

    <section class="card-tabela">
      <table class="tabela">
        <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Perfil</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          @for (u of filtrados(); track u.id) {
            <tr>
              <td class="col-nome">{{ u.nome }}</td>
              <td class="col-secundaria">{{ u.email }}</td>
              <td class="col-destaque">{{ u.perfil }}</td>
              <td>
                <span class="badge" [class.badge-inativo]="!u.ativo">
                  {{ u.ativo ? 'Ativo' : 'Inativo' }}
                </span>
              </td>
            </tr>
          } @empty {
            <tr><td colspan="4" class="sem-resultado">Nenhum usuário encontrado.</td></tr>
          }
        </tbody>
      </table>

      <p class="rodape-tabela">Total: <strong>{{ filtrados().length }}</strong> usuários</p>
    </section>
  </main>
</div>
